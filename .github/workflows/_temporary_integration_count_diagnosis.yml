name: Temporary integration count diagnosis

on:
  push:
    branches: [v3-diagnose-integration-counts]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-diagnose-integration-counts
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Instantiate
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Probe pristine-v3 symbolic determinism
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "=== symbolic run $i ==="
            julia --project=test test/symbolic_utils_test.jl || true
          done
      - name: Probe pristine-v3 instruction counts
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            echo "=== instruction-count run $i ==="
            julia --project=test test/instruction_count_test.jl || true
          done
