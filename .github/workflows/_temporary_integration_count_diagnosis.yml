name: Temporary integration count diagnosis

on:
  push:
    branches: [v3-diagnose-integration-counts]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-diagnose-integration-counts
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Instantiate
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Baseline symbolic + instruction counts
        run: |
          julia --project=test test/symbolic_utils_test.jl
          julia --project=test test/instruction_count_test.jl
      - name: Apply logarithm semantic commit
        run: |
          git config user.name 'diagnostic'
          git config user.email 'diagnostic@invalid.example'
          git cherry-pick 5e83ff3e23d9fd2aa0643c44fc57260a6b4da45c
      - name: Log-only symbolic + instruction counts
        run: |
          julia --project=test test/symbolic_utils_test.jl
          julia --project=test test/instruction_count_test.jl
