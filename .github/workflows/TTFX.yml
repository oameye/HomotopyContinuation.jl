name: TTFX

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/TTFX.yml'
      - 'src/**'
      - 'ext/**'
      - 'benchmark/ttfx_check.jl'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ttfx:
    name: TTFX check - Julia 1
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/julia-ttfx-check@main
        with:
          workload: 'benchmark/ttfx_check.jl'
