name: Temporary v2.22.4 parity classification

on:
  push:
    branches: [v3-v2-22-4-parity-ledger]

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-v2-22-4-parity-ledger
          fetch-depth: 0
      - name: Fetch exact upstream baseline
        run: |
          git clone --filter=blob:none https://github.com/JuliaHomotopyContinuation/HomotopyContinuation.jl.git /tmp/hc-v2
          git -C /tmp/hc-v2 checkout 0cbf1e27d062d7eb01d962c3b948c39444c9a62c
      - name: Build semantic ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          UPSTREAM_SHA = '0cbf1e27d062d7eb01d962c3b948c39444c9a62c'
          V3_SHA = 'b5c7c2e81f372c22a29ff2963743ab5fad1fa9ed'
          root = Path('/tmp/hc-v2/test')

          # File-family mapping is only the default. Specific implementation-only
          # testsets below override it explicitly.
          mapping = {
              'binomial_system_test.jl': ('equivalent-test', 'test/binomial_system_test.jl; test/compare_v2_primitives_test.jl', 'Same binomial/HNF capability, with additional overflow validation in v3.'),
              'certification_test.jl': ('replacement-test', 'lib/HomotopyContinuationNextCertification/test/', 'Certification moved to the dedicated certification subpackage; input forms and Krawczyk/Arb behavior are covered there.'),
              'double_double_test.jl': ('equivalent-test', 'test/double_f64_test.jl; test/compare_v2_primitives_test.jl', 'DoubleF64 arithmetic is reimplemented and directly compared with v2.'),
              'endgame_test.jl': ('replacement-test', 'test/endgame_test.jl; test/compare_v2_solve_counts_test.jl', 'Endgame behavior is covered by v3 endpoint/result parity tests.'),
              'endgame_tracker_test.jl': ('replacement-test', 'test/endgame_test.jl; test/tracking_test.jl', 'Tracker internals were rewritten; endpoint and tracking behavior is covered at the v3 interface.'),
              'homotopies_test.jl': ('replacement-test', 'test/core_test.jl; test/parameter_homotopy_test.jl; test/subspace_homotopy_test.jl; test/nonpolynomial_test.jl', 'Homotopy implementations were rewritten behind HomotopyEvaluator; corresponding interpolation, Taylor and tracking behavior is covered.'),
              'linear_algebra_test.jl': ('equivalent-test', 'test/linear_algebra_test.jl; test/compare_v2_primitives_test.jl', 'Core linear algebra primitives and condition estimation are directly covered.'),
              'linear_test.jl': ('replacement-test', 'test/linear_subspace_test.jl; test/subspace_homotopy_test.jl; test/linear_subspace_edge_cases_test.jl', 'LinearSubspace and subspace-homotopy behavior is covered by v3-native implementations.'),
              'monodromy_test.jl': ('replacement-test', 'test/monodromy_test.jl; test/monodromy_v2_parity_test.jl; test/monodromy_endpoint_validation_test.jl', 'Monodromy is v3-native but has direct v2 parity and endpoint/permutation regressions.'),
              'nid_test.jl': ('replacement-test', 'test/nid_test.jl; test/nid_losslessness_test.jl; test/regeneration_ordering_tolerances_test.jl', 'NID/regeneration are ambient-coordinate v3 implementations with direct v2 cases and new losslessness regressions.'),
              'norm_test.jl': ('equivalent-test', 'test/norms_test.jl; test/compare_v2_primitives_test.jl', 'Norm behavior is directly covered and compared with v2.'),
              'polyhedral_test.jl': ('replacement-test', 'test/polyhedral_regression_test.jl; test/solve_test.jl', 'Polyhedral solving uses rewritten mixed-cell plumbing but preserves solution behavior.'),
              'result_test.jl': ('replacement-test', 'test/result_iterator_test.jl; test/result_clustering_test.jl; test/path_diagnostics_test.jl', 'Result/iterator APIs were redesigned into typed routes; clustering, diagnostics and lazy tracking are covered.'),
              'runtests.jl': ('replacement-test', 'test/runtests.jl', 'Top-level suite wrapper.'),
              'semialgebraic_sets_test.jl': ('equivalent-test', 'test/semialgebraic_sets_test.jl', 'SemialgebraicSets integration is covered directly.'),
              'solve_test.jl': ('replacement-test', 'test/solve_test.jl; test/homotopy_solve_test.jl; test/many_targets_test.jl; test/subspace_solve_test.jl; test/compare_v2_solve_match_test.jl; test/compare_v2_solve_counts_test.jl', 'Solve routes are split by typed algorithm/iterator APIs; numerical behavior is directly compared with v2.'),
              'systems_test.jl': ('replacement-test', 'test/core_test.jl; test/composition_test.jl; test/fixed_parameter_test.jl; test/overdetermined_test.jl; test/sliced_solve_test.jl', 'System wrappers were redesigned at the evaluator layer; their user-visible behavior is covered.'),
              'tracker_test.jl': ('replacement-test', 'test/tracking_test.jl; test/tracker_regression_test.jl; test/predictor_zero_crossing_test.jl; test/tracker_warmstart_test.jl', 'Tracker implementation is new; v2 path behavior and recent zero-crossing regressions are covered.'),
              'unique_points_test.jl': ('equivalent-test', 'test/unique_points_test.jl; test/result_clustering_test.jl', 'Unique-point and multiplicity behavior is directly covered.'),
              'utils_test.jl': ('replacement-test', 'test/utils_test.jl', 'Utility behavior is covered by v3 equivalents; implementation details differ.'),
              'valuation_test.jl': ('equivalent-test', 'test/valuation_test.jl', 'Valuation behavior is directly covered.'),
              'voronoi_tree_test.jl': ('equivalent-test', 'test/voronoi_tree_test.jl', 'VoronoiTree behavior is directly covered.'),
              'witness_set_test.jl': ('replacement-test', 'test/witness_set_test.jl; test/witness_intersection_variables_test.jl; test/linear_subspace_edge_cases_test.jl', 'Witness sets use ambient-coordinate v3 architecture; affine/projective/membership/intersection semantics are covered.'),
              'extensive/extensive_test.jl': ('replacement-test', 'test/extensive/', 'Large-solve coverage is retained in the separate extensive suite.'),
              'test_cases/four_bar.jl': ('replacement-test', 'test/tracker_regression_test.jl; test/endgame_test.jl', 'Predictor/refinement behavior is covered in the rewritten tracker regression corpus.'),
              'test_cases/steiner_higher_prec.jl': ('replacement-test', 'test/endgame_test.jl; test/double_f64_test.jl', 'Extended-precision escalation is covered in v3 tracker/endgame and DoubleF64 tests.'),
              'model_kit/e2e_test.jl': ('replacement-test', 'test/system_sweep_test.jl; test/nonpolynomial_test.jl; test/codegen_test.jl', 'ModelKit execution modes became v3 compile modes with system-wide backend sweeps.'),
              'model_kit/operations_test.jl': ('replacement-test', 'test/operations_test.jl; test/taylor_test.jl', 'Operation/Taylor recurrences are covered by direct and Cauchy-oracle tests.'),
              'model_kit/slp_test.jl': ('replacement-test', 'test/interpreter_test.jl; test/codegen_test.jl; test/taylor_test.jl', 'SLP interpreted/compiled implementations became the tape/codegen evaluator pipeline.'),
              'model_kit/symbolic_test.jl': ('replacement-test', 'test/expression_test.jl; test/symbolic_utils_test.jl; test/polynomial_input_test.jl; test/nonpolynomial_test.jl', 'ModelKit symbolic functionality moved to the Expression and polynomial frontends.'),
              'model_kit_test.jl': ('replacement-test', 'test/system_sweep_test.jl; test/expression_test.jl; test/interpreter_test.jl', 'ModelKit umbrella behavior is split across v3 frontend/evaluator suites.'),
          }

          def classify(rel, line):
              stripped = line.strip()
              if stripped.startswith('#'):
                  return ('upstream-disabled', '-', 'The upstream testset occurrence is commented out and is not an active v2.22.4 release gate.')
              if rel == 'model_kit/compiled_cache_test.jl':
                  return ('architecture-obsolete', 'test/core_test.jl; test/distributed_test.jl', 'V3 has no process-global compiled cache; evaluator builders/clones provide task-local state, so the upstream cache race cannot occur.')
              if rel == 'model_kit/symbolic_test.jl' and 'SymEngine' in line:
                  return ('architecture-obsolete', 'test/expression_test.jl; test/polynomial_input_test.jl', 'V3 deliberately removed the SymEngine frontend; supported symbolic input is Expression or MultivariatePolynomials.')
              if rel == 'systems_test.jl' and 'MixedSystem' in line:
                  return ('architecture-obsolete', 'test/codegen_test.jl; test/system_sweep_test.jl', 'MixedSystem as a wrapper type is replaced by CompileMode and the evaluator firewall.')
              if rel == 'homotopies_test.jl' and 'MixedHomotopy' in line:
                  return ('architecture-obsolete', 'test/codegen_test.jl; test/homotopy_solve_test.jl', 'MixedHomotopy as a wrapper type is replaced by the v3 evaluator/compile-mode design.')
              if rel in mapping:
                  return mapping[rel]
              return ('unaccounted', '-', 'No semantic mapping has been assigned yet.')

          entries = []
          for path in sorted(root.rglob('*.jl')):
              rel = str(path.relative_to(root))
              for lineno, line in enumerate(path.read_text(errors='replace').splitlines(), 1):
                  if '@testset' not in line:
                      continue
                  c, evidence, rationale = classify(rel, line)
                  entries.append((rel, lineno, line.strip(), c, evidence, rationale))

          assert len(entries) == 208, len(entries)
          counts = {}
          for *_, c, _, _ in entries:
              counts[c] = counts.get(c, 0) + 1

          def q(s):
              return '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"'

          toml = [
              f'upstream_sha = {q(UPSTREAM_SHA)}',
              f'v3_base_sha = {q(V3_SHA)}',
              'upstream_testset_occurrences = 208',
              '',
          ]
          for rel, lineno, raw, c, evidence, rationale in entries:
              toml += [
                  '[[testset]]',
                  f'source = {q(rel)}',
                  f'line = {lineno}',
                  f'raw = {q(raw)}',
                  f'classification = {q(c)}',
                  f'evidence = {q(evidence)}',
                  f'rationale = {q(rationale)}',
                  '',
              ]
          Path('implementation_docs/v2_22_4_parity_ledger.toml').write_text('\n'.join(toml))

          md = [
              '# v2.22.4 semantic parity ledger', '',
              f'Upstream: `JuliaHomotopyContinuation/HomotopyContinuation.jl@{UPSTREAM_SHA}`.',
              f'V3 baseline: `oameye/HomotopyContinuation.jl@{V3_SHA}`.', '',
              'This ledger classifies every mechanically discovered upstream `@testset` occurrence.',
              'It is intentionally separate from source/API compatibility: implementation types removed by the v3 rewrite are not resurrected merely to retain names.', '',
              '## Classification counts', '',
          ]
          for c in sorted(counts):
              md.append(f'- `{c}`: **{counts[c]}**')
          md += ['', '## Review gate', '',
                 '- `unaccounted` must be zero before the ledger PR can be ready.',
                 '- `gap` must be zero before functional v2.22.4 parity can be claimed.',
                 '- `architecture-obsolete` entries require an explicit rationale and replacement evidence where applicable.',
                 '- Public/exported API compatibility is audited separately.', '']
          for c in ('unaccounted', 'architecture-obsolete', 'upstream-disabled'):
              subset = [e for e in entries if e[3] == c]
              md += [f'## {c}', '']
              if not subset:
                  md += ['None.', '']
              else:
                  for rel, lineno, raw, _, evidence, rationale in subset:
                      md.append(f'- `{rel}:{lineno}` — `{raw.replace("`", "\\`")}`')
                      md.append(f'  Evidence: `{evidence}`. {rationale}')
                  md.append('')
          Path('implementation_docs/v2_22_4_parity_ledger.md').write_text('\n'.join(md))
          print(counts)
          PY
      - name: Commit ledger and remove temporary workflow
        run: |
          rm .github/workflows/_temporary_v2_22_4_classify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add implementation_docs/v2_22_4_parity_ledger.toml implementation_docs/v2_22_4_parity_ledger.md .github/workflows/_temporary_v2_22_4_classify.yml
          git commit -m 'Classify v2.22.4 parity testsets'
          git push origin HEAD:v3-v2-22-4-parity-ledger
