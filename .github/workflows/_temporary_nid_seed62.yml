name: Temporary NID seed-62 diagnostic

on:
  push:
    branches: [v3-diagnose-nid-seed-62]

permissions:
  contents: write

jobs:
  seed62:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3-diagnose-nid-seed-62
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run upstream seed-62 regression on pristine v3
        run: |
          echo '' | base64 -d > /tmp/seed62.jl
          julia --project=test /tmp/seed62.jl
      - name: Remove temporary workflow
        if: always()
        run: |
          rm .github/workflows/_temporary_nid_seed62.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_temporary_nid_seed62.yml
          git commit -m 'Remove temporary NID seed-62 diagnostic'
          git push origin HEAD:v3-diagnose-nid-seed-62
