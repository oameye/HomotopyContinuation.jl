name: JET

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/JET.yml'
      - 'src/**'
      - 'ext/**'
      - 'quality/jet.jl'
      - 'quality/Project.toml'
      - 'Project.toml'
  pull_request:
    paths:
      - '.github/workflows/JET.yml'
      - 'src/**'
      - 'ext/**'
      - 'quality/jet.jl'
      - 'quality/Project.toml'
      - 'Project.toml'
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  jet:
    name: JET / Julia 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate quality environment
        run: julia --project=quality -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=quality quality/jet.jl
