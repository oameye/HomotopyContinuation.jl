name: Quality

on:
  push:
    branches: [v3]
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'benchmark/**'
      - 'quality/**'
  pull_request:
    branches: [v3]
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'benchmark/**'
      - 'quality/**'
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  dispatch-doctor:
    name: DispatchDoctor / Julia 1.10
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Exercise package-wide DispatchDoctor contract
        run: julia --project=test --threads=1 --color=yes quality/dispatch_doctor.jl

  strict-mode:
    name: StrictMode / Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1.13'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate quality environment
        run: julia --project=quality -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Prove compiled type stability
        run: julia --project=quality --threads=1 --color=yes quality/strict_mode.jl
