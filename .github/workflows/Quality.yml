name: Quality

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'benchmark/**'
      - 'quality/**'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'benchmark/**'
      - 'quality/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  static-contracts:
    name: Static contracts - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run package and compiler contracts
        run: |
          julia --project=test test/quality/aqua_test.jl
          julia --project=test test/quality/alloc_check_test.jl
          julia --project=test test/quality/concrete_structs_test.jl
          julia --project=test test/quality/explicit_imports_test.jl
          julia --project=test test/quality/instruction_count_test.jl
          julia --project=test test/quality/linear_subspace_compiler.jl
          julia --project=test test/quality/monodromy_compiler.jl
          julia --project=test test/quality/nid_compiler.jl

  strict-mode:
    name: StrictMode - Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1.13'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate quality environment
        run: julia --project=quality -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Prove compiled type stability
        run: julia --project=quality --threads=1 --color=yes quality/strict_mode.jl
