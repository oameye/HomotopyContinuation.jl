name: Quality

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'workloads/**'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Quality.yml'
      - 'Project.toml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'workloads/**'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  static-contracts:
    name: Static contracts - Julia 1
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=".")); Pkg.instantiate()'
      - name: Run package and compiler contracts
        run: |
          julia --project=test test/quality/aqua.jl
          julia --project=test test/quality/allocations.jl
          julia --project=test test/quality/concrete_types.jl
          julia --project=test test/quality/explicit_imports.jl
          julia --project=test test/quality/inference.jl
          julia --project=test test/quality/instruction_count.jl
      - name: Set up certification test environment
        run: >-
          julia --project=lib/HomotopyContinuationCertification/test -e
          'using Pkg; Pkg.develop([PackageSpec(path="."),
          PackageSpec(path="lib/HomotopyContinuationCertification")]); Pkg.instantiate()'
      - name: Run certification package contracts
        run: |
          julia --project=lib/HomotopyContinuationCertification/test lib/HomotopyContinuationCertification/test/quality/aqua.jl
          julia --project=lib/HomotopyContinuationCertification/test lib/HomotopyContinuationCertification/test/quality/concrete_types.jl
          julia --project=lib/HomotopyContinuationCertification/test lib/HomotopyContinuationCertification/test/quality/explicit_imports.jl
          julia --project=lib/HomotopyContinuationCertification/test lib/HomotopyContinuationCertification/test/quality/jet.jl

  strict-mode:
    name: StrictMode - Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ !github.event.pull_request.draft }}
    permissions:
      actions: write
      contents: read
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1.13'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate quality environment
        run: julia --project=test/quality/strict_mode -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Prove compiled type stability
        run: julia --project=test/quality/strict_mode --threads=1 --color=yes test/quality/strict_mode/strict_mode.jl
