name: Benchmarks

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Benchmarks.yml'
      - 'src/**'
      - 'ext/**'
      - 'benchmark/**'
      - 'Project.toml'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Benchmarks.yml'
      - 'src/**'
      - 'ext/**'
      - 'benchmark/**'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write
  contents: read
  pull-requests: write

env:
  JULIA_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  benchmark:
    name: Benchmark tracking - Julia 1.13
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: '1.13'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Restore benchmark history
        id: benchmark-history
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-history/steady.json
          key: steady-main-${{ runner.os }}-julia-1.13-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: |
            steady-main-${{ runner.os }}-julia-1.13-
      - name: Run benchmarks
        run: |
          cd benchmark
          julia --project --threads=1 --gcthreads=1 --color=yes -e '
            using Pkg
            Pkg.develop(PackageSpec(path=joinpath(pwd(), "..")))
            Pkg.instantiate()
            include("runbenchmarks.jl")'
      - name: Prepare benchmark history directory
        run: mkdir -p .benchmark-history
      - name: Compare benchmark results on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: HomotopyContinuation
          tool: julia
          output-file-path: benchmark/benchmarks_output.json
          external-data-json-path: .benchmark-history/steady.json
          save-data-file: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          alert-threshold: '130%'
          fail-threshold: '170%'
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          comment-always: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          summary-always: true
          fail-on-alert: true
      - name: Update benchmark history on main
        if: ${{ github.event_name == 'push' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: HomotopyContinuation
          tool: julia
          output-file-path: benchmark/benchmarks_output.json
          external-data-json-path: .benchmark-history/steady.json
          save-data-file: true
          alert-threshold: '130%'
          fail-on-alert: false
          summary-always: true
      - name: Save benchmark history
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache/save@v4
        with:
          path: .benchmark-history/steady.json
          key: steady-main-${{ runner.os }}-julia-1.13-${{ github.sha }}
