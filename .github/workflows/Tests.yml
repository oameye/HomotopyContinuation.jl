name: Tests

on:
  push:
    branches: [v3]
    paths:
      - '.github/workflows/Tests.yml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'quality/**'
      - 'Project.toml'
  pull_request:
    branches: [v3]
    paths:
      - '.github/workflows/Tests.yml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'quality/**'
      - 'Project.toml'
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  JULIA_NUM_THREADS: '4'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  core:
    name: Core / Julia ${{ matrix.version }}${{ matrix.dispatch_doctor && ' + DispatchDoctor' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.10'
            dispatch_doctor: false
            runner: test/runtests.jl
          - version: '1'
            dispatch_doctor: true
            runner: test/strict/runtests.jl
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Enable DispatchDoctor hard-error instrumentation
        if: ${{ matrix.dispatch_doctor }}
        run: cp test/strict/LocalPreferences.toml test/LocalPreferences.toml
      - name: Instantiate core test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run core suite
        run: julia --project=test ${{ matrix.runner }} --jobs=4
      - name: Exercise first-call paths under instrumentation
        if: ${{ matrix.dispatch_doctor }}
        run: julia --project=test --threads=1 --color=yes quality/dispatch_doctor.jl

  certification:
    name: Certification / Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Instantiate certification test environment
        run: >-
          julia --project=lib/HomotopyContinuationCertification/test -e
          'using Pkg; Pkg.develop([Pkg.PackageSpec(path="."),
          Pkg.PackageSpec(path="lib/HomotopyContinuationCertification")]); Pkg.instantiate()'
      - name: Run certification suite
        run: julia --project=lib/HomotopyContinuationCertification/test -t 4 lib/HomotopyContinuationCertification/test/runtests.jl
