name: Tests

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Tests.yml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'Project.toml'
  pull_request:
    branches:
      - 'main'
    paths:
      - '.github/workflows/Tests.yml'
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'lib/**'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

env:
  JULIA_NUM_THREADS: 4
  OPENBLAS_NUM_THREADS: 1
  OMP_NUM_THREADS: 1

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          force_latest_compatible_version: ${{ matrix.version == 'min' && 'false' || 'auto' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
        if: ${{ matrix.version == 'min' }}
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          name: codecov-umbrella
          fail_ci_if_error: false
        if: ${{ matrix.version == 'min' }}

  certification:
    name: Certification - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Set up certification test environment
        run: >-
          julia --project=lib/HomotopyContinuationCertification/test -e
          'using Pkg; Pkg.develop([PackageSpec(path=pwd()),
          PackageSpec(path="lib/HomotopyContinuationCertification")]); Pkg.instantiate()'
      - name: Run certification suite
        run: julia --project=lib/HomotopyContinuationCertification/test -t 4 lib/HomotopyContinuationCertification/test/runtests.jl
